name: Leak Scan

# Whole-tree text guards: private-reference leaks (#226) and Unicode dashes (#293).
#
# Both need to see EVERY tracked file including markdown and docs/, which is what
# this workflow uniquely provides (see the paths-ignore note below); that shared
# requirement, not a shared subject, is why they run together here.
#
# Fails the build if a tracked file re-introduces an internal/personal reference
# the de-internalization sweep (#229) removed: maintainer names in non-attribution
# files, the private cloud-build infra, personal home paths, internal
# planning/coordination doc + tool filenames, or the private issue tracker. See
# scripts/check-private-leaks.mjs for the rules and rationale.
#
# IMPORTANT - this workflow runs with NO `paths-ignore`, unlike `ci.yml` (`check`)
# and `e2e-smoke.yml` (`smoke`), which BOTH ignore `**/*.md` and `docs/**`. A leak
# most often lands in exactly those files (e.g. a new `docs/plans/*.md`), so a
# docs-only change runs neither of those jobs - the gate must run on EVERYTHING.
# The same argument applies verbatim to the dash guard: prose carries the most
# em-dashes and a docs-only PR must not slip past it.
#
# "EVERYTHING" is about PATHS, not branches: the triggers below are still scoped
# to `master`, so a PR onto a long-lived non-master base runs neither gate until
# it is finally merged toward master. Inherited posture, noted so the sentence
# above is not read as broader than it is.
#
# Pure-Node, no dependencies (only `git ls-files` + the stdlib), no secrets - so
# it runs on fork PRs too. Sub-second. Safe to block on because `master` is
# unprotected (no required-check deadlock, per #122).
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege: the job only reads the checked-out tree (no API, no token use).
permissions:
  contents: read

concurrency:
  group: leak-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Pin the rules with the fixture test first (proves each rule still fires on
      # its target and that the functional CI-picker tokens do NOT), then scan the
      # tracked tree.
      - name: Private-leak rules - fixture test
        run: node scripts/check-private-leaks.test.mjs
      - name: Private-leak scan
        run: node scripts/check-private-leaks.mjs
      # The Unicode-dash guard (issue #293) rides along here for the same reason
      # the leak scan does: this workflow has NO path filter, and `check`/`smoke`
      # both path-ignore `**/*.md` and `docs/**`, which is where most prose lives.
      - name: No-em-dash rules - fixture test
        run: node scripts/check-no-em-dash.test.mjs
      - name: No-em-dash scan
        run: node scripts/check-no-em-dash.mjs
      # Third-party attribution staleness gate (#226): a dependency change must
      # come with a regenerated THIRD-PARTY-LICENSES.md (pnpm gen:third-party).
      # It lives HERE, not in `check`, because `check` path-ignores `**/*.md` -
      # a PR touching only the bundle would never run a gate placed there (the
      # "gate consumes a path-ignored file" class). Pure-Node hash comparison;
      # no cargo-about, no pnpm install.
      - name: Third-party license bundle - fixture test
        run: node scripts/check-third-party-licenses.test.mjs
      - name: Third-party license bundle gate
        run: node scripts/check-third-party-licenses.mjs
      # Updater pubkey/endpoint tripwire (#579): passes trivially while
      # plugins.updater is absent from tauri.conf.json, and turns red the
      # day a placeholder or malformed pubkey is committed in its place.
      # Pure-Node, no dependencies - same reason it lives here rather than
      # `check`, which path-ignores nothing this gate needs anyway but is
      # kept alongside its siblings for consistency.
      - name: Updater pubkey/endpoint - fixture test
        run: node scripts/check-updater-pubkey.test.mjs
      - name: Updater pubkey/endpoint gate
        run: node scripts/check-updater-pubkey.mjs
      # Updater manifest generator fixture test (#579): scripts/gen-updater-manifest.mjs
      # runs only at release time (invoked from the release job's "Publish
      # updater manifest" step, with real artifacts as input), so there is no
      # live-repo invariant for a second gate step to check here - only the
      # fixture test, alongside its sibling updater gate above.
      - name: Updater manifest generator - fixture test
        run: node scripts/gen-updater-manifest.test.mjs
