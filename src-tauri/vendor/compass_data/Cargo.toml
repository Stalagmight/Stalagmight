# Vendored fork of compass_data v0.0.7 (https://github.com/zheylmun/compass_data),
# MIT OR Apache-2.0. See MODIFICATIONS.md for local changes. The upstream CLI
# binary and JSON example are dropped here; Stalagmight only needs the library.
[package]
name = "compass_data"
version = "0.0.7"
edition = "2024"
authors = ["Zach Heylmun <zheylmun@gmail.com>"]
description = "A library for working with Compass cave survey data (Stalagmight fork)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zheylmun/compass_data"
readme = "README.md"

[lib]
name = "compass_data"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
miette = "7"
nom = "8"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
float_eq = "1"
pretty_assertions = "1"
serde_json = "1"

[features]
default = []
serde = ["dep:serde"]
