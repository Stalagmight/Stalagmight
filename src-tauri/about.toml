# cargo-about config for the third-party license bundle.
# Consumed by scripts/gen-third-party-licenses.mjs (pnpm gen:third-party).
# Generated with cargo-about 0.9.1 (install the pinned version - harvested
# texts can differ across cargo-about releases, which would churn the bundle):
#   cargo install cargo-about --version 0.9.1 --locked --features cli
#
# Dev-dependencies never ship in the built app, so they are excluded from the
# attribution set. Build-dependencies are kept: over-attribution is harmless,
# and some build-time code (macros) does shape the shipped binary.
ignore-dev-dependencies = true
#
# `accepted` is an allowlist: generation FAILS if any dependency carries a
# license not listed here, so a future dependency with a copyleft or unknown
# license is a loud stop, not a silent inclusion.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "0BSD",
    "Apache-2.0 WITH LLVM-exception",
    "CDLA-Permissive-2.0",
    # Stalagmight's own license: cargo-about resolves the workspace crate too.
    # The generator drops first-party crates from the output, so this entry only
    # stops resolution failing, it does not put AGPL text in the bundle.
    "AGPL-3.0-or-later",
    # The published SpeleoDB SDK.
    "AGPL-3.0-only",
]
