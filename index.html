<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- user-scalable=no / maximum-scale=1: this is an application shell, not a
         page - browser pinch/page zoom would scale the whole UI (reachable via
         a pinch landing on map overlay chrome on touch builds, #409 review).
         The app has its own zoom for the map and a UI-scale setting. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <title>Stalagmight</title>
    <!-- No remote stylesheet: the MapLibre CSS is bundled from node_modules
         (src/main.tsx), so the CSP's style-src is 'self' alone and the app
         styles itself offline (#576 C12). The <style> block below
         needs no 'unsafe-inline', but the mechanism is a NONCE, not a hash:
         tauri-codegen stamps nonce="__TAURI_STYLE_NONCE__" onto every <style>
         at build time (map_core_assets -> inject_nonce_token), and at serve time
         set_csp -> replace_csp_nonce swaps in a random value and appends the
         matching 'nonce-...' to style-src. Tauri hashes .js/.mjs assets ONLY
         (tauri-codegen embedded_assets.rs: "we only hash JavaScript files for
         now"), and its style-hash vector is unreachable without the isolation
         feature, so no sha256 is ever computed for this block.
         Editing the CSS in here therefore cannot break the CSP. Two things can:
         hand-writing a nonce attribute on the <style> (inject_nonce skips
         elements that already have one), or setting
         dangerousDisableAssetCspModification to true or to a list containing
         "style-src" - either drops the nonce and this block is refused in
         production only, since devCsp carries 'unsafe-inline'. -->
    <style>
      /* Anti-flash cover for the frame before the CSS bundle loads;
         html[data-theme] then hands over to the live token. #1a1a2e is :root's
         --cc-background, which is also what the first React commit paints:
         config arrives async over IPC, so useTheme stamps data-theme="dark"
         before the real theme is known (src/hooks/useTheme.ts). Matching it
         means cover and first commit agree instead of stepping. A light-theme
         user still gets these dark frames - fixing that needs a last-known
         theme readable before the bundle runs, which nothing persists today.
         Do NOT key this off prefers-color-scheme: useTheme consults the OS only
         when theme is "auto", and the shipped default is "dark"
         (src/types/ipc/defaultConfig.ts), so that guess paints cream then dark
         on a light-appearance machine - a flash the default did not have.
         Do NOT put a background back on <body>: an inline style there outranks
         its own bg-background class, which is what pinned this first frame dark
         in every theme (#332); App.tsx's root div covers the body after that.
         Both rules are pinned by src/theme/__tests__/tokens.test.ts.

         #1a1a2e is also the native window's `backgroundColor` in
         src-tauri/tauri.conf.json (#357 item 13): the OS paints that color
         before this stylesheet or any HTML exists, so it is a single static
         value picked to match the app's default (dark) theme and cannot
         itself follow a light/dark theme switch - only this later CSS can. */
      html {
        background-color: #1a1a2e;
      }
      html[data-theme] {
        background-color: var(--cc-background);
      }
    </style>
  </head>
  <body class="bg-background text-text-primary">
    <div id="root"></div>
    <div id="dialog-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
