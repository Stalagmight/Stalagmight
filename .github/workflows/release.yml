name: Release
on:
  push:
    tags: ['v*']
  # Rehearsal path. A dispatch runs verify + the full build matrix but stops
  # short of publishing (the release job is tag-gated), so the per-platform
  # bundle paths and globs can be proven without cutting a tag first.
  workflow_dispatch:

# Build the bundled SQLite without FTS3/4/5, RTREE, DBSTAT and extension
# loading, so a hostile .stalx cannot reach them (#608, docs/toolchain.md).
env:
  LIBSQLITE3_FLAGS: "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -DSQLITE_OMIT_LOAD_EXTENSION"

jobs:
  # Gate the release on the checks the tagged commit should already have passed.
  # Linux-only, which is what this workflow did before it grew a build matrix.
  # Running the suite on macOS and Windows too is tracked separately (#325);
  # note Windows needs STALAGMIGHT_TEST_MANIFEST=1 (see scripts/test.ps1).
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The candidate build identity the build legs bake in (#650). Empty for a
    # final, a dispatch rehearsal and any other tag.
    outputs:
      prerelease: ${{ steps.channel.outputs.prerelease }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # scripts/release-channel.sh is the one definition of what a tag bakes
      # and publishes; the release job and repoint-updater-manifest.yml read
      # the same script. Classified once here, on Linux, and handed to the
      # build legs as job outputs: nothing in this workflow runs a repo shell
      # script on the Windows leg, and this keeps it that way. Only a tag ref
      # is classified - a dispatch from a branch builds with no candidate
      # identity, like a final.
      - name: Classify the release tag
        id: channel
        shell: bash
        run: |
          TAG=""
          case "$GITHUB_REF" in
            refs/tags/*) TAG="$GITHUB_REF_NAME" ;;
          esac
          bash scripts/release-channel.sh classify "$TAG" | tee -a "$GITHUB_OUTPUT"
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch @ 2026-06-30
      # Cached here but deliberately NOT in `build`: this job compiles only to
      # run tests, while `build` produces the binaries people install, and those
      # are worth the cold compile.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tsc --noEmit
      # The attribution bundle ships inside every installer, and the leak-scan
      # workflow that normally gates it runs on branch/PR events only - a
      # direct tag push would otherwise publish installers carrying a stale
      # THIRD-PARTY-LICENSES.md.
      - name: Third-party license bundle gate
        run: |
          node scripts/check-third-party-licenses.test.mjs
          node scripts/check-third-party-licenses.mjs
      # Same rationale as the license gate above: the leak-scan workflow that
      # normally runs this gate covers branch/PR events only, and the pubkey
      # is the update trust root baked into every released client - a direct
      # tag push from a commit that skipped leak-scan must not reach the paid
      # build matrix with a placeholder or malformed key.
      - name: Updater pubkey gate
        run: |
          node scripts/check-updater-pubkey.test.mjs
          node scripts/check-updater-pubkey.mjs
      # scripts/gen-updater-manifest.mjs has no live-repo invariant to check
      # (it runs against release artifacts that only exist later in this same
      # workflow), so unlike the pubkey gate above there is only a fixture
      # test to run here - but it has to run here regardless: a tag push must
      # not reach the paid build matrix carrying a broken generator, only to
      # fail once the `release` job finally invokes it after every platform
      # has already built.
      - name: Updater manifest generator - fixture test
        run: node scripts/gen-updater-manifest.test.mjs
      - name: Offline Rust workspace tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace --features telemetry -- --skip speleodb::client::tests::live_used_api_calls_with_email_and_token
        env:
          SPELEODB_API_TEST_ENABLED: "false"
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"
      # The flags above only take effect if libsqlite3-sys reads them; this pins
      # the compiled-in options. Ignored in a plain local `cargo test` (#608).
      - name: Bundled SQLite compile options
        run: cargo test --manifest-path src-tauri/Cargo.toml -p stalagmight-persistence --lib -- --ignored --exact persistence::sqlite::tests::bundled_sqlite_omits_virtual_table_modules_and_extension_loading
      # Release-profile compile check (#541): the debug-profile test run above
      # cannot see a call whose only target is cfg(debug_assertions)-gated
      # (debug_assert! arguments still type-check in release), and this job is
      # the last thing standing between a tag/dispatch and the paid
      # three-platform matrix. Type resolution only - codegen, LTO and link
      # failures still surface in `build`.
      - name: Release-profile compile check
        run: cargo check --release --workspace --manifest-path src-tauri/Cargo.toml --features telemetry
        env:
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"

      - name: SpeleoDB live API tests
        if: github.event_name != 'pull_request'
        run: cargo test --manifest-path src-tauri/Cargo.toml -p stalagmight-speleodb --lib --features telemetry speleodb::client::tests::live_used_api_calls_with_email_and_token -- --exact --nocapture
        env:
          SPELEODB_API_TEST_ENABLED: "true"
          SPELEODB_INSTANCE_URL: ${{ secrets.SPELEODB_INSTANCE_URL }}
          SPELEODB_OAUTH_TOKEN: ${{ secrets.SPELEODB_OAUTH_TOKEN }}
          SPELEODB_EMAIL: ${{ secrets.SPELEODB_EMAIL }}
          SPELEODB_PASSWORD: ${{ secrets.SPELEODB_PASSWORD }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/config
          TELEMETRY_ENDPOINT: "https://test.invalid/v1/events"

  build:
    needs: verify
    strategy:
      # Build every platform even when one fails, so a single broken target
      # reports alongside the others instead of masking them. The release job
      # still needs all three, so nothing half-complete gets published.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          # Apple Silicon only, deliberately. No maintainer has an Intel Mac, so
          # an arch-specific bug there could not be reproduced or fixed - better
          # not to ship a binary nobody can debug. Every platform therefore
          # builds native for its runner, and none passes --target, which is why
          # the bundle path below is the same for all three.
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    # The signing secrets (Apple Developer ID, updater key) live in the
    # `release` environment, not at repo level: a workflow pushed on any
    # branch can read repo secrets, and these sign builds under the
    # maintainer's identity. The environment's required reviewer must approve
    # every run that reaches this job, a tag push and a dispatch rehearsal
    # alike. See docs/releasing.md, "Secrets".
    environment: release
    env:
      BUNDLE_DIR: src-tauri/target/release/bundle
    # macOS and Windows runners bill at a multiple of the Linux rate, and the
    # DMG bundler has a known way to hang (see the build step). Without a ceiling
    # the default is 6 hours on the most expensive runner in the matrix.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch @ 2026-06-30
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The updater pubkey is committed (plugins.updater.pubkey in
      # tauri.conf.json, checked by the verify job's pubkey gate), but
      # createUpdaterArtifacts stays out of the checked-in config: with it on,
      # tauri-cli signs every updater bundle and fails outright when
      # TAURI_SIGNING_PRIVATE_KEY is unset. Enablement is therefore CI-side
      # only (the Build step below merges it in via --config), so a local
      # `pnpm tauri build` never needs the signing key. It is still gated on
      # the pubkey being present, so a fork that removes the key builds
      # without updater artifacts instead of failing.
      - name: Determine updater enablement
        id: updater
        shell: bash
        run: |
          PUBKEY=$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)
          if [ -n "$PUBKEY" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::warning::updater artifacts DISABLED - no plugins.updater.pubkey committed yet (issue #579)"
          fi
      # Actions sets CI=true, which is what stops Tauri's DMG bundler from
      # driving Finder over AppleScript and hanging headless (see mac-build.sh).
      # shell: bash so the `--` separating tauri args from cargo args is handled
      # identically everywhere. The Windows default is pwsh, which parses it.
      # Telemetry is compiled in only when the TELEMETRY_ENDPOINT secret is
      # NON-EMPTY (an undefined secret expands to ""; a whitespace-only secret
      # passes this probe and then fails loudly in build.rs - safe direction).
      # A fork has no such secret, and build.rs hard-fails on an empty endpoint
      # under --features telemetry, so the guard is what lets a fork release at
      # all: without the secret the build simply omits telemetry (which is also
      # opt-in at runtime). Secrets are not readable from `if:` expressions on
      # steps, hence the shell check on the env var.
      - name: Build
        shell: bash
        run: |
          # GitHub renders unset secrets as EMPTY strings, and tauri-bundler
          # keys on env-var PRESENCE (var_os) for APPLE_CERTIFICATE - an
          # empty-but-present value sends it down the keychain-import path
          # with an empty certificate, which fails `security import` on every
          # macOS build (seen live: run 31671174336). So the six APPLE_* vars
          # arrive under *_SECRET staging names and the bundler-recognized
          # names are exported only when non-empty.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            s="${v}_SECRET"
            if [ -n "${!s:-}" ]; then
              export "$v"="${!s}"
            fi
          done
          # A release candidate (vX.Y.Z-rc.N) bakes its pre-release part and
          # the Beta channel into the app (#650): the app reads both with
          # option_env!, so they have to be in the environment cargo inherits
          # through `pnpm tauri build`. The version files and every artifact
          # name stay plain X.Y.Z (the MSI bundler rejects a non-numeric
          # pre-release; see scripts/release-tag.sh). Same presence rule as the
          # APPLE_* names above: exported only when non-empty, and unset
          # otherwise, because option_env! reads an empty-but-present variable
          # as Some(""), not as "no candidate".
          if [ -n "$CHANNEL_PRERELEASE" ]; then
            if [ -z "$CHANNEL_NAME" ]; then
              echo "::error::the tag classified as a candidate ($CHANNEL_PRERELEASE) but with no channel - scripts/release-channel.sh and this step disagree."
              exit 1
            fi
            export STALAGMIGHT_PRERELEASE="$CHANNEL_PRERELEASE"
            export STALAGMIGHT_CHANNEL="$CHANNEL_NAME"
            echo "Candidate build: STALAGMIGHT_PRERELEASE=$STALAGMIGHT_PRERELEASE STALAGMIGHT_CHANNEL=$STALAGMIGHT_CHANNEL"
          else
            unset STALAGMIGHT_PRERELEASE STALAGMIGHT_CHANNEL
            echo "Not a candidate build: STALAGMIGHT_PRERELEASE and STALAGMIGHT_CHANNEL left unset."
          fi
          # When the pubkey is present TAURI_SIGNING_PRIVATE_KEY is required.
          # Tauri itself already refuses to sign without it (its own error),
          # so this exists only to fail earlier with a named secret rather
          # than let a fork chase Tauri's unnamed one.
          if [ "$UPDATER_ON" = "true" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret not set. plugins.updater.pubkey is committed, so this build enables bundle.createUpdaterArtifacts and Tauri cannot sign the resulting updater artifacts without it - set TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has one)."
            exit 1
          fi
          # Real Developer ID signing needs all three notarization credentials
          # alongside the identity - a partial set produces a signed-but-
          # unnotarized bundle that fails obscurely much later, inside
          # `xcrun stapler validate`. Name what's missing now instead.
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            MISSING=()
            [ -n "$APPLE_ID" ] || MISSING+=("APPLE_ID")
            [ -n "$APPLE_PASSWORD" ] || MISSING+=("APPLE_PASSWORD")
            [ -n "$APPLE_TEAM_ID" ] || MISSING+=("APPLE_TEAM_ID")
            if [ "${#MISSING[@]}" -gt 0 ]; then
              echo "::error::APPLE_SIGNING_IDENTITY is set but missing secret(s): ${MISSING[*]}. Set all of APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID together with APPLE_SIGNING_IDENTITY, or unset it to fall back to ad-hoc signing."
              exit 1
            fi
          fi
          BUNDLE_CFG='{}'
          if [ "$UPDATER_ON" = "true" ]; then
            BUNDLE_CFG='{"createUpdaterArtifacts":true}'
          fi
          if [ "${{ matrix.os }}" = "macos-latest" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            CFG=$(jq -cn --argjson bundle "$BUNDLE_CFG" --arg id "$APPLE_SIGNING_IDENTITY" '{bundle: ($bundle + {macOS: {signingIdentity: $id}})}')
          else
            CFG=$(jq -cn --argjson bundle "$BUNDLE_CFG" '{bundle: $bundle}')
          fi
          if [ -n "$TELEMETRY_ENDPOINT" ]; then
            pnpm tauri build --config "$CFG" -- --features telemetry
          else
            echo "TELEMETRY_ENDPOINT secret not set - building without telemetry."
            pnpm tauri build --config "$CFG"
          fi
        env:
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          # Staged names; the run block exports STALAGMIGHT_PRERELEASE and
          # STALAGMIGHT_CHANNEL from them only for a candidate.
          CHANNEL_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          CHANNEL_NAME: ${{ needs.verify.outputs.channel }}
          TELEMETRY_ENDPOINT: ${{ secrets.TELEMETRY_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple credentials are optional (empty on a fork, or until they are
          # provisioned - see docs/releasing.md). Staged under *_SECRET names:
          # the run block exports the real names only when non-empty, because
          # tauri-bundler treats a present-but-empty APPLE_CERTIFICATE as a
          # request to import it. With none set, Tauri falls back to the
          # checked-in ad-hoc `signingIdentity: "-"` - byte-identical to
          # pre-#579 behavior.
          APPLE_CERTIFICATE_SECRET: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD_SECRET: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
      # Tauri notarizes and staples the .app, then builds the DMG around it and
      # signs the DMG with the same Developer ID - but never notarizes the DMG.
      # Gatekeeper assesses a quarantined, SIGNED disk image when it is opened
      # (`spctl -a -t open --context context:primary-signature`), and a
      # Developer-ID-signed but unnotarized DMG is rejected there, so a user
      # would hit a malware warning before ever reaching the notarized app.
      # Submit the DMG too and staple its ticket. Before the checksum step, as
      # stapling rewrites the file.
      - name: Notarize and staple the macOS DMG
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Ad-hoc build: nothing to notarize."
            exit 0
          fi
          shopt -s nullglob
          dmgs=( "$BUNDLE_DIR"/dmg/*.dmg )
          [ "${#dmgs[@]}" -eq 1 ] || { echo "::error::expected exactly 1 DMG, found ${#dmgs[@]}"; exit 1; }
          xcrun notarytool submit "${dmgs[0]}" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "${dmgs[0]}"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The verify job checks the SQLite strip on Linux only, but the flags work
      # by a later -U cancelling libsqlite3-sys's own -D, which each platform's C
      # compiler (MSVC on Windows) must honour. Check it with this leg's
      # compiler before anything ships (#608).
      - name: Bundled SQLite compile options (this platform)
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml -p stalagmight-persistence --lib -- --ignored --exact persistence::sqlite::tests::bundled_sqlite_omits_virtual_table_modules_and_extension_loading
      # v0.5.0-rc1 shipped a .app that macOS refused to open as "damaged". The
      # cause was an absent signature rather than a corrupt download: with no
      # signing identity Tauri skips codesign entirely, leaving only the Rust
      # linker's ad-hoc signature on the inner binary, which is inconsistent with
      # the bundle around it. That is an *invalid* signature, and unlike the
      # ordinary unnotarized-app warning the user cannot click past it. Tauri now
      # ad-hoc signs via bundle.macOS.signingIdentity, which happens before the
      # DMG is built. Verify the app inside the DMG, because that is the artifact
      # someone actually downloads, and a silent regression here is invisible
      # until a human tries to launch it. See #350.
      # Shared with scripts/mac-build.sh so the local build and the release check
      # cannot drift apart - two copies of this check with different artifacts is
      # how rc1 shipped in the first place. `matrix.os` matches the idiom used by
      # the Linux step above; a skipped step here would mean a green publish, so
      # the condition is worth keeping boring and consistent.
      - name: Verify the shipped macOS app is validly signed
        if: matrix.os == 'macos-latest'
        shell: bash
        run: ./scripts/verify-macos-signature.sh "$BUNDLE_DIR/dmg"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - name: Collect release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          echo "=== All bundle output ==="
          find "$BUNDLE_DIR" -maxdepth 2 -type f || true
          echo "=== Copying artifacts ==="
          # One list for every platform; only the host's own bundles exist.
          for pattern in \
            deb/*.deb \
            deb/*.deb.sig \
            rpm/*.rpm \
            rpm/*.rpm.sig \
            appimage/*.AppImage \
            appimage/*.AppImage.sig \
            dmg/*.dmg \
            msi/*.msi \
            msi/*.msi.sig \
            nsis/*-setup.exe \
            nsis/*-setup.exe.sig \
            macos/*.app.tar.gz \
            macos/*.app.tar.gz.sig
          do
            cp "$BUNDLE_DIR"/$pattern release-artifacts/ 2>/dev/null || true
          done
          echo "=== Collected ==="
          ls -lh release-artifacts/
          FILE_COUNT=$(find release-artifacts -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::No artifacts found in $BUNDLE_DIR"
            exit 1
          fi
          # Only asserted when updater artifacts are actually enabled for this
          # build (see "Determine updater enablement" above) - while the
          # pubkey is pending, tauri-bundler emits no .sig files at all.
          if [ "$UPDATER_ON" = "true" ]; then
            SIG_COUNT=$(find release-artifacts -maxdepth 1 -name '*.sig' -type f | wc -l)
            if [ "$SIG_COUNT" -eq 0 ]; then
              echo "::error::updater artifacts are enabled but no *.sig files were found in $BUNDLE_DIR"
              exit 1
            fi
          fi
        env:
          UPDATER_ON: ${{ steps.updater.outputs.on }}
      # Nothing is notarized (macOS is only ad-hoc signed, Windows not at all),
      # and the release notes tell recipients how to click past the OS warning,
      # so give them something to check the download against. Computed on the
      # runner that built the bytes.
      - name: Checksum this platform's artifacts
        shell: bash
        working-directory: release-artifacts
        run: |
          # macOS has shasum, not sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            SUM="sha256sum"
          else
            SUM="shasum -a 256"
          fi
          $SUM * > "$RUNNER_TEMP/sums"
          mv "$RUNNER_TEMP/sums" "SHA256SUMS-${{ matrix.name }}"
          cat "SHA256SUMS-${{ matrix.name }}"
      # Job-internal record of which macOS signing path ran. Consumed by the
      # release job's "Publish updater manifest" step: only "developer-id"
      # lets the macOS build into the updater manifest at all - "adhoc" is
      # excluded outright, never treated as a lesser-but-acceptable variant,
      # because the updater channel is trusted and an ad-hoc build carries no
      # verifiable identity. Written after the checksum step on purpose: it
      # must not appear in SHA256SUMS-macos (nothing downloads it, so it has
      # no checksum to verify), and the release job deletes it before
      # `gh release create release-artifacts/*` so it never becomes a
      # published asset.
      - name: Record macOS signing marker
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "developer-id" > release-artifacts/MACOS-SIGNED
          else
            echo "adhoc" > release-artifacts/MACOS-SIGNED
          fi
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.name }}
          path: release-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    # Only a tag publishes. A workflow_dispatch rehearsal stops after `build`.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Which manifests this tag publishes, and with which version: the same
      # scripts/release-channel.sh the verify job used to pick what the build
      # legs baked, so the two cannot disagree about a tag shape. This job
      # only runs for a tag ref (see `if:` above).
      - name: Classify the release tag
        id: channel
        shell: bash
        run: bash scripts/release-channel.sh classify "$GITHUB_REF_NAME" | tee -a "$GITHUB_OUTPUT"
      # The build job cannot pass its per-leg UPDATER_ON output across job
      # boundaries, so this job derives the same fact the same way: a
      # non-empty plugins.updater.pubkey in the checked-out tauri.conf.json.
      - name: Determine updater enablement
        id: updater
        shell: bash
        run: |
          PUBKEY=$(jq -r '.plugins.updater.pubkey // empty' src-tauri/tauri.conf.json)
          if [ -n "$PUBKEY" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      # Preflight (#579), runs BEFORE `gh release create` below makes this
      # tag's own release public. The "Publish updater manifest" step's own
      # `gh release view updater` check runs far too late to prevent the bad
      # outcome: by the time it fires, the versioned release is already live,
      # so a missing/renamed rolling `updater` release then strands a public
      # release with no manifest update - and a re-run dies on `gh release
      # create` refusing a tag that already exists. Checking here means
      # nothing has been published yet if `updater` needs recreating.
      - name: Preflight rolling updater release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          CHANNEL_KIND: ${{ steps.channel.outputs.kind }}
          CHANNEL_MANIFEST_VERSION: ${{ steps.channel.outputs.manifest_version }}
        run: |
          if [ "$UPDATER_ON" != "true" ]; then
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          # Same classification the publish step below routes on: a tag that
          # is neither a final nor an rc.N candidate publishes no manifest, so
          # there is nothing to preflight for it.
          if [ "$CHANNEL_KIND" != final ] && [ "$CHANNEL_KIND" != candidate ]; then
            exit 0
          fi
          if ! gh release view updater >/dev/null 2>&1; then
            echo "::error::the rolling 'updater' GitHub release does not exist, but tag $TAG will publish an updater manifest. See docs/releasing.md (Updater manifests) to create it once, then re-run - before anything else in this job becomes public."
            exit 1
          fi
          # Forward-only Beta (#650), checked here, before the release is
          # public: a candidate must be newer than whatever latest-beta.json
          # already announces. An rc.1 pushed after rc.2, or a candidate for a
          # version whose final already shipped, would otherwise point Beta
          # back at an older build - installs already past it are never
          # offered it, and installs behind it would get it instead of the
          # newest one. A candidate has no other reason to exist, so it is
          # refused outright. A final is not refused here: a maintenance
          # release below the current Stable is legitimate, so the publish
          # step instead leaves any track it would move backwards alone. A
          # missing latest-beta.json (the first candidate ever) has nothing to
          # compare against; a present one that cannot be read fails closed.
          # Moving a track backwards on purpose is what
          # repoint-updater-manifest.yml is for.
          if [ "$CHANNEL_KIND" = candidate ]; then
            ASSETS="$(gh release view updater --json assets --jq '.assets[].name')"
            if grep -qx 'latest-beta.json' <<<"$ASSETS"; then
              mkdir -p "$RUNNER_TEMP/preflight-beta"
              gh release download updater -p latest-beta.json -D "$RUNNER_TEMP/preflight-beta"
              CURRENT="$(jq -r '.version' "$RUNNER_TEMP/preflight-beta/latest-beta.json")"
              RC=0
              bash scripts/release-channel.sh is-newer "$CHANNEL_MANIFEST_VERSION" "$CURRENT" || RC=$?
              case "$RC" in
                0) echo "latest-beta.json holds $CURRENT; $CHANNEL_MANIFEST_VERSION is newer." ;;
                1)
                  echo "::error::latest-beta.json already announces $CURRENT, which is not lower than $CHANNEL_MANIFEST_VERSION. Refusing to move Beta backwards. Cut a higher candidate, or roll the beta track back on purpose with the repoint-updater-manifest.yml workflow (docs/releasing.md, Rollback / repoint runbook)."
                  exit 1
                  ;;
                *)
                  echo "::error::could not compare $CHANNEL_MANIFEST_VERSION with the version in the current latest-beta.json ('$CURRENT'). Refusing to publish a candidate blind; check that file, or repoint the beta track (docs/releasing.md, Rollback / repoint runbook)."
                  exit 1
                  ;;
              esac
            else
              echo "No latest-beta.json on the 'updater' release yet; this candidate starts the Beta track."
            fi
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - run: ls -lh release-artifacts/
      # `needs: build` already blocks a partial matrix from reaching this job.
      # This re-checks the artifacts themselves, so completeness does not rest
      # on that single upstream edge, and confirms the bytes still match what
      # the build runners hashed.
      - name: Verify checksums and assemble SHA256SUMS
        shell: bash
        working-directory: release-artifacts
        run: |
          cat SHA256SUMS-* > "$RUNNER_TEMP/SHA256SUMS"
          rm SHA256SUMS-*
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          sha256sum -c SHA256SUMS
          # At least one installable per platform. Grouped by platform rather
          # than asserting every extension, so a bundler dropping (say) the .rpm
          # doesn't block an otherwise complete release.
          shopt -s nullglob
          linux=( *.deb *.rpm *.AppImage )
          macos=( *.dmg )
          windows=( *.msi *.exe )
          [ ${#linux[@]}   -gt 0 ] || { echo "::error::no Linux artifact";   exit 1; }
          [ ${#macos[@]}   -gt 0 ] || { echo "::error::no macOS artifact";   exit 1; }
          [ ${#windows[@]} -gt 0 ] || { echo "::error::no Windows artifact"; exit 1; }
          # Updater artifacts are only required when they were enabled at
          # build time (see "Determine updater enablement" above) - while the
          # pubkey is pending, no build leg produced any .sig at all.
          if [ "$UPDATER_ON" = "true" ]; then
            linux_sig=( *.AppImage.sig )
            windows_sig=( *-setup.exe.sig )
            macos_tar=( *.app.tar.gz )
            macos_tar_sig=( *.app.tar.gz.sig )
            [ ${#linux_sig[@]}     -gt 0 ] || { echo "::error::no Linux updater signature (*.AppImage.sig)";    exit 1; }
            [ ${#windows_sig[@]}   -gt 0 ] || { echo "::error::no Windows updater signature (*-setup.exe.sig)"; exit 1; }
            [ ${#macos_tar[@]}     -gt 0 ] || { echo "::error::no macOS update bundle (*.app.tar.gz)";          exit 1; }
            [ ${#macos_tar_sig[@]} -gt 0 ] || { echo "::error::no macOS updater signature (*.app.tar.gz.sig)";  exit 1; }
          fi
          echo "SHA256SUMS:"; cat SHA256SUMS
        env:
          UPDATER_ON: ${{ steps.updater.outputs.on }}
      # Job-internal: records which macOS signing path the build job used
      # (see "Record macOS signing marker" above). Captured into this step's
      # own output BEFORE the file is removed - the "Publish updater
      # manifest" step below is the consumer, deciding --include-darwin by
      # whether the value is EXACTLY "developer-id" (never merely
      # non-empty: "adhoc" must exclude the macOS build, not include it).
      # Also exported as MACOS_SIGNING for release-notes.sh, which picks the
      # macOS install instructions from it.
      # A missing marker is only a warning here, unconditionally - the
      # publish step is what turns that into a hard failure, and only when
      # updater artifacts are actually enabled for this tag; see there.
      # Deleted regardless, so it never rides along with
      # `gh release create release-artifacts/*` below - it is not an
      # installable artifact and nobody downloads it.
      - name: Consume macOS signing marker
        id: macos-signing
        shell: bash
        working-directory: release-artifacts
        run: |
          if [ -f MACOS-SIGNED ]; then
            MODE="$(tr -cd 'a-z-' < MACOS-SIGNED)"
            echo "macOS signing mode: $MODE"
            echo "mode=$MODE" >> "$GITHUB_OUTPUT"
            # release-notes.sh picks the macOS install instructions from this:
            # a notarized app must not be published with quarantine-stripping
            # advice, and an ad-hoc one must not promise a clean launch.
            echo "MACOS_SIGNING=$MODE" >> "$GITHUB_ENV"
            rm MACOS-SIGNED
          else
            echo "::warning::MACOS-SIGNED marker missing from release artifacts"
            echo "mode=" >> "$GITHUB_OUTPUT"
          fi
      # Same script you can run locally to preview the body before tagging, so
      # what gets published is never a surprise.
      - name: Build release notes
        shell: bash
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-body.md"
      - name: Create release and upload artifacts
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # A tag carrying a suffix (v0.5.2-rc.1) is a candidate, not a release.
          # Without --prerelease it would become "Latest" and be handed to
          # everyone as the real thing.
          PRERELEASE=()
          case "${TAG#v}" in
            *-*) PRERELEASE=(--prerelease); echo "Publishing $TAG as a pre-release" ;;
          esac
          gh release create "$TAG" \
            --title "Stalagmight ${TAG}" \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            "${PRERELEASE[@]}" \
            release-artifacts/*
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Updater manifests (#579, #650): the rolling `updater` GitHub release
      # carries latest-stable.json and latest-beta.json, plus latest-weekly.json
      # as a byte-for-byte mirror of the beta one (the weekly track is retired,
      # and 0.5.0/0.5.1 installs set to "Weekly" read that file). Each is
      # overwritten on every publish to it. scripts/release-channel.sh decides
      # which: a final vX.Y.Z publishes Stable, Beta and the mirror, each
      # only where it is newer than what that track holds; a
      # candidate vX.Y.Z-rc.N publishes Beta and the mirror; any other tag
      # (the old -rcN shape included) publishes none. See docs/releasing.md
      # (Updater manifests) for the full flow, including how to repoint or
      # roll one back.
      - name: Publish updater manifest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER_ON: ${{ steps.updater.outputs.on }}
          MACOS_MODE: ${{ steps.macos-signing.outputs.mode }}
          CHANNEL_KIND: ${{ steps.channel.outputs.kind }}
          CHANNEL_BASE: ${{ steps.channel.outputs.base }}
          CHANNEL_MANIFEST_VERSION: ${{ steps.channel.outputs.manifest_version }}
          CHANNEL_MANIFESTS: ${{ steps.channel.outputs.manifests }}
        run: |
          if [ "$UPDATER_ON" != "true" ]; then
            echo "::notice::updater artifacts are disabled (no plugins.updater.pubkey committed yet - issue #579) - skipping updater manifest publish."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          if [ "$CHANNEL_KIND" != final ] && [ "$CHANNEL_KIND" != candidate ]; then
            echo "::notice::no updater manifest for tag $TAG: only a final vX.Y.Z (Stable and Beta) or a candidate vX.Y.Z-rc.N (Beta) publishes one."
            exit 0
          fi
          read -r -a MANIFESTS <<<"$CHANNEL_MANIFESTS"
          if [ "${#MANIFESTS[@]}" -eq 0 ] || [ -z "$CHANNEL_BASE" ] || [ -z "$CHANNEL_MANIFEST_VERSION" ]; then
            echo "::error::tag $TAG classified as $CHANNEL_KIND but with no manifests, base or manifest version - scripts/release-channel.sh and this step disagree."
            exit 1
          fi
          # The manifest version has to match what was actually baked into
          # these artifacts, or updater clients loop forever. A candidate's
          # artifacts are plain X.Y.Z (only the pre-release part is baked, via
          # STALAGMIGHT_PRERELEASE), and the X.Y.Z comes from whatever the
          # tree said at build time, not from the tag: a hand-pushed
          # v0.5.2-rc.1 on a tree still at 0.5.1 builds 0.5.1 artifacts while
          # this manifest would claim 0.5.2-rc.1. An updater on that build
          # would see 0.5.2-rc.1 as newer than itself, download it, and
          # relaunch the exact same build - forever. Parse the version
          # actually baked into the artifacts (their filenames encode it, e.g.
          # Stalagmight_0.5.1_amd64.AppImage - the same pattern the
          # completeness check above globs) and refuse to publish unless it is
          # the tag's base version, for a final and a candidate alike.
          ARTIFACT_VERSIONS=$(find release-artifacts -maxdepth 1 -type f -name 'Stalagmight_*' \
            | sed -E 's#.*/Stalagmight_([0-9]+\.[0-9]+\.[0-9]+)_.*#\1#' \
            | sort -u)
          ARTIFACT_VERSION_COUNT=$(printf '%s\n' "$ARTIFACT_VERSIONS" | grep -c . || true)
          if [ "${ARTIFACT_VERSION_COUNT:-0}" -eq 0 ]; then
            echo "::error::could not parse a built app version from any release artifact filename (expected Stalagmight_X.Y.Z_...)."
            exit 1
          fi
          if [ "$ARTIFACT_VERSION_COUNT" -gt 1 ]; then
            echo "::error::release artifacts disagree on their built version: $(printf '%s, ' $ARTIFACT_VERSIONS)"
            exit 1
          fi
          ARTIFACT_VERSION="$ARTIFACT_VERSIONS"
          if [ "$CHANNEL_BASE" != "$ARTIFACT_VERSION" ]; then
            echo "::error::tag $TAG has base version $CHANNEL_BASE but the built artifacts are version $ARTIFACT_VERSION - refusing to publish a mismatched manifest (see the comment above for the update loop this prevents)."
            exit 1
          fi
          # Only a Developer ID build enters the manifest. "adhoc" is not a
          # lesser flavor of the same trust level - it is what every macOS
          # build gets when no signing identity is configured, and shipping
          # it through the trusted updater channel would let the updater
          # replace a notarized install with an ad-hoc one on every existing
          # user's machine. An empty MODE (see below) is refused outright,
          # never silently treated as "no macOS build".
          if [ -z "$MACOS_MODE" ]; then
            echo "::error::UPDATER_ON is true but the MACOS-SIGNED marker never reached this job - the build job either did not run the macOS leg or something is structurally wrong. Refusing to guess; a silent default here would publish a manifest with no macOS entry (or the wrong one) on an otherwise-green run."
            exit 1
          fi
          INCLUDE_DARWIN=false
          if [ "$MACOS_MODE" = "developer-id" ]; then
            INCLUDE_DARWIN=true
          else
            echo "::warning::macOS build was ad-hoc signed (not Developer ID) - excluding it from the updater manifest. Ad-hoc artifacts must never reach the trusted update channel."
          fi
          # Generated once and copied, so every manifest this tag publishes is
          # byte-identical (pub_date included) - the weekly mirror and, for a
          # final, Stable and Beta alike.
          OUT="$RUNNER_TEMP/updater-manifest.json"
          node scripts/gen-updater-manifest.mjs \
            --version "$CHANNEL_MANIFEST_VERSION" \
            --tag "$TAG" \
            --dir release-artifacts \
            --notes-file "$RUNNER_TEMP/release-body.md" \
            --out "$OUT" \
            --include-darwin "$INCLUDE_DARWIN"
          # The rolling release is created once, by hand, per issue #579 - this
          # workflow only ever uploads to it, never creates it, so a missing
          # release fails loudly instead of silently doing nothing useful.
          # Already checked by the "Preflight rolling updater release" step
          # above, before `gh release create` made this tag's release public -
          # this is a backup for the race where it disappears in between.
          if ! gh release view updater >/dev/null 2>&1; then
            echo "::error::the rolling 'updater' GitHub release does not exist. See docs/releasing.md (Updater manifests) to create it once, then re-run this job."
            exit 1
          fi
          # A final must not move any track backwards (#650). Each track it
          # would publish to takes it only when that track's manifest is
          # missing or older than the final: a v0.5.3 maintenance release cut
          # after v0.6.0 still publishes its GitHub release, but leaves
          # latest-stable.json on 0.6.0 (a ::warning::, since Stable installs
          # will not be offered it), and a 0.5.2 hotfix cut while 0.5.3-rc.1 is
          # out leaves Beta and its weekly mirror on the candidate (a
          # ::notice::, as that is Beta working as intended). Read here, just
          # before the upload, so the window for another run to publish in
          # between is as short as this step can make it. A version that
          # cannot be read leaves its track alone and fails the step loudly,
          # after whatever else could be published was uploaded. A candidate
          # needs nothing here: the preflight already refused one that is not
          # newer than Beta.
          drop_manifests() {
            local keep=() name x skip
            for name in "${MANIFESTS[@]}"; do
              skip=""
              for x in "$@"; do [ "$name" = "$x" ] && skip=1; done
              [ -n "$skip" ] || keep+=("$name")
            done
            MANIFESTS=("${keep[@]}")
          }
          # Sets CHECK (0: the final is newer or there is no manifest yet,
          # 1: the manifest holds a version that is not older, 2: unreadable)
          # and CURRENT (the version the manifest holds). Called as a plain
          # statement so `-e` still applies inside it.
          check_track() {
            local name="$1" track="$2" dir="$RUNNER_TEMP/at-publish-$2"
            CHECK=0
            CURRENT=""
            if ! grep -qx "$name" <<<"$ASSETS"; then
              echo "No $name on the 'updater' release yet; $track takes this final."
              return 0
            fi
            mkdir -p "$dir"
            gh release download updater -p "$name" -D "$dir"
            CURRENT="$(jq -r '.version' "$dir/$name")"
            bash scripts/release-channel.sh is-newer "$CHANNEL_MANIFEST_VERSION" "$CURRENT" || CHECK=$?
            if [ "$CHECK" -eq 0 ]; then
              echo "$name holds $CURRENT; $CHANNEL_MANIFEST_VERSION is newer, so $track takes this final."
            fi
          }
          UNREADABLE=()
          if [ "$CHANNEL_KIND" = final ]; then
            ASSETS="$(gh release view updater --json assets --jq '.assets[].name')"
            check_track latest-stable.json stable
            case "$CHECK" in
              0) ;;
              1)
                echo "::warning::stable holds $CURRENT, which is not older than $CHANNEL_MANIFEST_VERSION; leaving latest-stable.json alone. The GitHub release for $TAG is published, but Stable installs will not be offered it. To point Stable at it anyway, use the repoint-updater-manifest.yml workflow (docs/releasing.md, Rollback / repoint runbook)."
                drop_manifests latest-stable.json
                ;;
              *)
                UNREADABLE+=("latest-stable.json ('$CURRENT')")
                drop_manifests latest-stable.json
                ;;
            esac
            check_track latest-beta.json beta
            case "$CHECK" in
              0) ;;
              1)
                if [ "$CURRENT" = "$CHANNEL_MANIFEST_VERSION" ]; then
                  echo "::notice::beta already holds $CURRENT; leaving beta and its weekly mirror."
                else
                  echo "::notice::beta holds $CURRENT, newer than $CHANNEL_MANIFEST_VERSION; leaving beta and its weekly mirror."
                fi
                drop_manifests latest-beta.json latest-weekly.json
                ;;
              *)
                UNREADABLE+=("latest-beta.json ('$CURRENT')")
                drop_manifests latest-beta.json latest-weekly.json
                ;;
            esac
          fi
          FILES=()
          for name in "${MANIFESTS[@]}"; do
            cp "$OUT" "release-artifacts/$name"
            FILES+=("release-artifacts/$name")
          done
          if [ "${#FILES[@]}" -gt 0 ]; then
            gh release upload updater "${FILES[@]}" --clobber
            echo "Published ${MANIFESTS[*]} to the 'updater' release ($CHANNEL_KIND, manifest version $CHANNEL_MANIFEST_VERSION)."
          else
            echo "No updater manifest written for $TAG: no track it could publish to would move forward."
          fi
          if [ "${#UNREADABLE[@]}" -gt 0 ]; then
            echo "::error::could not compare $CHANNEL_MANIFEST_VERSION with the version in ${UNREADABLE[*]}, so that track was left alone. The GitHub release for $TAG is published${MANIFESTS[*]:+, and so is ${MANIFESTS[*]}}. Check the file, then repoint the track by hand (docs/releasing.md, Rollback / repoint runbook) if it should take this final."
            exit 1
          fi
