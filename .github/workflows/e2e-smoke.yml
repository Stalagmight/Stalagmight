name: E2E Smoke

# Fast Playwright @smoke subset - the reliable, every-change gate (issue #23).
# Runs against the Vite dev server with mocked Tauri IPC, so it needs only
# Node + Chromium (no Rust/Tauri build). The comprehensive suite runs nightly
# (see nightly-e2e.yml).
# Smoke runs the app with MOCKED Tauri IPC, so a Rust-only (`src-tauri/**`) change
# cannot affect it - skip those here (a real IPC-contract change lands as a `src/**`
# diff via the committed generated types and re-triggers). Also skip docs + the
# separate WDIO legacy suite. Blocklist style; safe because `master` is unprotected (#122).
on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/agent/**', 'src-tauri/**']
  pull_request:
    branches: [master]
    paths-ignore: ['**/*.md', 'docs/**', 'e2e/agent/**', 'src-tauri/**']

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Parallel-safety guard (#126): fail before the (slow) browser install if any
      # e2e-playwright spec introduces a pattern that breaks `fullyParallel` - own
      # server/port, fixed-path disk write, foreign host:port, or describe.serial.
      # This is the only CI job that runs the Playwright tier on `e2e-playwright/**`
      # changes (`check` path-ignores them), so the gate lives here. See docs/TESTING.md.
      # Its fixture test runs first, like every sibling gate's (#576 E7).
      - name: Check e2e-playwright parallel-safety
        run: |
          pnpm lint:e2e-parallel:test
          pnpm lint:e2e-parallel
      # No unannotated hard sleeps (#576 E14): every page.waitForTimeout needs a
      # `// settle: <reason>` comment above it (the negative-space waits that a
      # poll cannot express); everything else waits for its condition. Same
      # placement reasoning as the step above; sub-second, before the browser.
      - name: Check e2e-playwright for unannotated sleeps
        run: |
          pnpm lint:e2e-no-sleep:test
          pnpm lint:e2e-no-sleep
      # `check` path-ignores `e2e-playwright/**`, and root `tsconfig.json` includes
      # only `src`, so without this the specs and the IPC mock are type-checked by
      # nothing. This is the job that runs on `e2e-playwright/**` changes, so the
      # gate belongs here. (e2e/agent + e2e/lib are `check`'s typecheck:agent;
      # only generated replay specs under e2e/agent/replays/ are ungoverned, #466.)
      - name: Typecheck Playwright specs + IPC mock
        run: pnpm typecheck:playwright
      # The TS file-size ratchet measures e2e-playwright/ too (#576 E8-D2), and
      # `check` - its other home - path-ignores e2e-playwright/**, so an
      # e2e-playwright-only PR that grows the frozen IPC mock is gated here.
      # Pure Node, sub-second; the same full-scope run as in `check`.
      - name: TS file-size ratchet
        run: |
          pnpm lint:ts-file-size:test
          pnpm lint:ts-file-size
      # ESLint lints e2e-playwright/ too (#576 D1), and `check` - its other home -
      # path-ignores e2e-playwright/**, so a spec-only PR is gated here. The same
      # full-scope run (src, e2e-playwright, e2e) and baseline as in `check`.
      - name: ESLint (hook rules, ratcheted warnings)
        run: |
          pnpm lint:eslint:test
          pnpm lint:eslint
      # mockContract pins the mock against lib.rs's generate_handler! list. It lives
      # in the vitest suite, which only `check` runs - and `check` path-ignores
      # `e2e-playwright/**`, so a mock-only edit (the exact change most likely to
      # break the contract) would otherwise be gated by nothing.
      # On a PR that touches src/ too this runs in both jobs. That duplication is
      # deliberate: this is the copy that closes the gap, so do not delete it.
      - name: Mock IPC contract
        run: pnpm test:mock-contract
      # Every critical feature in docs/TESTING.md ("Critical features") still has
      # its named @smoke canary (#576 E5) - an untagged, renamed or skipped
      # canary fails here, before the browser install. The list lives in docs/,
      # which this workflow path-ignores, so leak-scan.yml runs the same check
      # for a docs-only edit to the table.
      - name: Critical-feature smoke canaries
        run: |
          pnpm lint:smoke-features:test
          pnpm lint:smoke-features
      # The per-test timing report below is what the @smoke set's time budget is
      # managed with, so its arithmetic is pinned by fixture tests (hook
      # attribution, Worker Cleanup exclusion, failed-run flagging,
      # workflow-command sanitizing). This is the reporter's self-test, not a
      # time budget: nothing here fails because a test got slow. Cheap, and it
      # fails before the slow browser install.
      - name: Timing reporter - self-test
        run: pnpm test:pw-timing
      # Cache the Chromium browser (~120 MB) so it isn't re-downloaded each run.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright browsers + system deps
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Playwright system deps (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Per-test timing, kept permanently (#576 E5-D3): the @smoke set is held to
      # a time budget (docs/plans/2026-07-25_smoke-pare-down.md), and this report
      # is the only per-test cost data CI has to manage it with.
      # CI gives no per-test timing: the `github` reporter prints a line only for
      # tests that failed or flaked, so a green run tells us the suite took ~6.5
      # min but not which tests spent it. A second reporter adds a
      # machine-readable per-test report; per the nightly's note, passing
      # --reporter on the CLI overrides the config reporter WITHOUT touching the
      # shared playwright.config.ts and WITHOUT wrapping the command, so the exit
      # code (the merge gate) is untouched. Costs ~1s.
      # NB: `pnpm exec playwright test`, NOT `pnpm test:ui:smoke -- …` - pnpm
      # forwards the `--` literally and playwright reads it as a positional test
      # filter ("No tests found"). Keep the --grep in sync with test:ui:smoke.
      # NB: the custom reporter, NOT the built-in `json` one - `json` does not emit
      # `steps`, so it cannot separate beforeEach cost from test-body cost. That
      # split is the whole point: measured locally, hooks are ~64% of smoke test
      # time, so the suite is slow because of per-test setup, not slow assertions.
      - name: Run Playwright (@smoke)
        run: pnpm exec playwright test --grep @smoke --reporter=github,./scripts/pw-timing-reporter.mjs
        env:
          # CI=true already gives 2 retries via playwright.config.ts.
          PW_TIMING_OUTPUT: playwright-report/timing.json
      # Ranked cost table on the run summary page. Unlike the nightly (which keeps
      # its report only on failure/flake), timing is wanted on GREEN runs - that
      # is the normal case - so this always runs and writes to the run page,
      # making the data readable with no artifact download. Defensive: always(),
      # cannot fail the job.
      - name: Smoke timing summary (run page)
        if: always()
        run: |
          f="playwright-report/timing.json"
          if [ ! -f "$f" ]; then
            echo "⏱️ **Smoke timing** - results file not found (see job log)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/pw-timing-summary.mjs "$f" --top 40 \
            || echo "⏱️ **Smoke timing** - could not parse results (see job log)." >> "$GITHUB_STEP_SUMMARY"
      # Machine-readable backup so the full per-test report can be scraped across
      # several runs (`gh run download <id> -n smoke-timing`). Short retention:
      # each run's numbers are superseded by the next, so a week is enough to
      # compare a handful of runs.
      - name: Upload smoke timing report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-timing
          path: playwright-report/timing.json
          retention-days: 7
          if-no-files-found: ignore
