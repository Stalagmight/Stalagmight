[package]
name = "stalagmight-speleodb"
version = "0.0.0"
publish = false
edition.workspace = true
license.workspace = true

# Opt into the workspace lint tables (see the workspace root manifest) so the
# anti-slop policy applies here too.
[lints]
workspace = true

[features]
# Compiles the `#[cfg(any(test, feature = "test-support"))]` helpers that used
# to be `#[cfg(test)]` when this code lived in the root crate (the
# grant_permission collaborator setup for the two-account live tests): the root
# crate's tests still call them, and a dependency's `cfg(test)` items are
# invisible to a dependent's test build. Enabled only via the root crate's
# [dev-dependencies] entry, so production builds compile exactly what they did
# before the split.
test-support = []
# Forwards to the telemetry member: the per-endpoint coverage test in
# metrics.rs is gated on `#[cfg(all(test, feature = "telemetry"))]` and needs
# the real registry (`EVENT_NAMES`), which only exists with the feature on.
# The root crate's own `telemetry` feature forwards here, so a featured
# workspace build turns every layer on together.
telemetry = ["stalagmight-telemetry/telemetry"]

[dependencies]
stalagmight-models = { path = "../models" }
stalagmight-telemetry = { path = "../telemetry" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
ts-rs = { workspace = true, features = ["no-serde-warnings"] }
http = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

speleodb-api = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
tempfile = { workspace = true }


[dev-dependencies]
dotenvy = { workspace = true }
# Synthetic native SQLite files for API round-trip tests.
stalagmight-persistence = { path = "../persistence" }
tempfile = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
