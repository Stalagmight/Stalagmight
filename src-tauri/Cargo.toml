[package]
name = "stalagmight"
version = "0.5.2"
description = "Cave Survey Processing Application"
authors = ["Stalagmight Team"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Stalagmight/Stalagmight"
default-run = "stalagmight"

# Hybrid workspace root: this package stays where it is, extracted crates land
# in crates/*.
[workspace]
members = [
    "crates/core",
    "crates/export",
    "crates/models",
    "crates/parsers",
    "crates/persistence",
    "crates/speleodb",
    "crates/stalx-reader",
    "crates/telemetry",
]
resolver = "2"
# Required: path deps inside the workspace directory are auto-adopted as
# members, which would drag the vendored crate into the fmt/clippy gates.
exclude = ["vendor/compass_data"]

# Shared keys future members inherit via `key.workspace = true`. Deliberately
# no `version` here: members declare their own 0.0.0, and the root package
# keeps its real version line above (scripts/release.sh asserts on it).
[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"

# Single source of truth for shared dependency versions; members write
# `dep = { workspace = true }` and may add features (workspace features are
# additive). tauri + its plugins, tauri-build, and the vendored compass_data
# path dep stay declared on the packages that use them.
[workspace.dependencies]
serde = "1"
serde_json = "1"
rusqlite = "0.41"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
chrono = "0.4"
ts-rs = "7"
thiserror = "1"
anyhow = "1"
toml = "0.8"
directories = "5"
svg2pdf = "0.12"
usvg = "0.43"
resvg = "0.43"
sha2 = "0.10"
uuid = "1"
# Pinned exact - rationale on the speleodb member's entry (crates/speleodb).
ureq = "=3.1.4"
http = "1"
percent-encoding = "2"
# `default-features = false` must live HERE for these two: a member-level
# `default-features = false` is ignored (with a warning) when the workspace
# entry doesn't carry it, which would silently re-enable default features.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
quick-xml = "0.37"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
rmp-serde = "1"
serde_bytes = "0.11"
igrf = "0.2"
proj4rs = "0.1"
time = "0.3"
tempfile = "3.24.0"

[features]
e2e = ["tauri-plugin-webdriver-automation"]
# Forwards to the members that own the implementations, and stays a real
# feature of this crate too: the root's own `#[cfg(feature = "telemetry")]`
# users (the registry coverage tests in commands/) are gated on it. The
# speleodb member forwards for the same reason (its metrics.rs coverage test).
telemetry = ["stalagmight-telemetry/telemetry", "stalagmight-speleodb/telemetry"]
# Dev-only: gates the gen_ipc_types example so it isn't compiled in normal
# builds/tests. Enabled by `pnpm gen:ipc-types`.
ipc-typegen = []

[lib]
name = "stalagmight_lib"
# staticlib dropped - only needed for iOS, which isn't configured (no
# src-tauri/gen/apple). cdylib stays for Android (src-tauri/gen/android).
crate-type = ["lib", "cdylib"]

# Dev-only IPC type generator. Kept as an *example* rather than a `[[bin]]` so
# Tauri's bundler doesn't try to copy it into the .app: the bundler enumerates
# every bin target, and a feature-gated bin still appears in that list but isn't
# built → `tauri build` failed to copy it. `required-features` also keeps it out
# of default `cargo build`/`test`/`--release` - only `pnpm gen:ipc-types` (which
# passes --features ipc-typegen) compiles it.
[[example]]
name = "gen_ipc_types"
path = "examples/gen_ipc_types.rs"
required-features = ["ipc-typegen"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stalagmight-core = { path = "crates/core" }
stalagmight-export = { path = "crates/export" }
stalagmight-models = { path = "crates/models" }
stalagmight-parsers = { path = "crates/parsers" }
stalagmight-persistence = { path = "crates/persistence" }
stalagmight-speleodb = { path = "crates/speleodb" }
stalagmight-telemetry = { path = "crates/telemetry" }
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# HELD AT 2.9.x ON PURPOSE. From 2.10.0 the plugin requires `tauri = "2.10"`,
# which drags `tauri-runtime-wry` to 2.10 and therefore `wry` to 0.54 - and
# that silently drops the `[patch.crates-io]` wry fork below (pinned at
# 0.53.5 for the Linux WebKit memory-pressure fix). ~2.9.0 is the newest
# release that still accepts `tauri = "2.9.x"`, i.e. the tauri we are on.
# Moving off 2.9.x means rebasing the wry fork onto 0.54 first.
tauri-plugin-updater = "~2.9.0"
# The plugin's `version_comparator` hands over `semver::Version`s, and the
# effective version (#650, `commands::app_update`) is built as one. Already in
# the tree through tauri and the plugin; named here so the type can be.
semver = "1"
serde = { workspace = true, features = ["derive"] }
# `float_roundtrip` is REQUIRED, not a preference. serde_json's default float
# parser is best-effort and lands up to 1 ULP away from the value the writer
# emitted: it writes `-26.759999999999998` faithfully and reads it back as
# `-26.76`. Every undo/redo snapshot is a serialized `Project`
# (`AppState::restore_snapshot_into`), so without this an undo silently rewrites
# survey measurements in their last bit - and the closure-adjusted geometry, which
# is what the map draws and every export writes, moved by 28 microns on a shot
# whose stored value never changed (issue #413, finding 25). Costs ~2x on float
# parsing only.
serde_json = { workspace = true, features = ["float_roundtrip"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
tracing-appender = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ts-rs = { workspace = true, features = ["no-serde-warnings"] }
anyhow = { workspace = true }
directories = { workspace = true }
sha2 = { workspace = true }
# The tile fetch. The exact pin (and the `multipart` feature it exists for)
# is explained on the speleodb member's entry (crates/speleodb).
ureq = { workspace = true }
http = { workspace = true }
image = { workspace = true }
tauri-plugin-webdriver-automation = { git = "https://github.com/FumblingBarbell/tauri-webdriver", branch = "fix/resolve-element-refs-in-execute-sync", optional = true }

# Second-instance forwarding for the OS file association (#424): "Open with" on
# an already-running app must hand the path to the running window, not start a
# rival process.
#
# HELD AT 2.3.x ON PURPOSE. From 2.4.0 the plugin requires `tauri = "2.10"`,
# which drags `tauri-runtime-wry` to 2.10 and therefore `wry` to 0.54 - and that
# silently drops the `[patch.crates-io]` wry fork below (pinned at 0.53.5 for the
# Linux WebKit memory-pressure fix). 2.3.7 is the newest release that still
# accepts `tauri = "2.9.3"`, i.e. the tauri we are on. Moving off 2.3.x means
# rebasing the wry fork onto 0.54 first.
#
# NOT on macOS, deliberately: LaunchServices already routes a second open of a
# bundled `.app` to the running instance as an Apple event, which Tauri delivers
# as `RunEvent::Opened`. The plugin's macOS backend would layer a second,
# redundant mechanism (a `/tmp` unix socket plus `process::exit(0)` in the
# newcomer) on top of that - and it fires for *every* second launch, including
# the ones the dev/e2e workflows depend on.
[target.'cfg(all(not(target_os = "macos"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "~2.3.7"

# Minimally-patched wry so the Linux WebKit web process returns freed memory to
# the OS. The patch adds `WebKitMemoryPressureSettings` (read from
# `STALAGMIGHT_WEBKIT_MEM_*` env vars set in `lib.rs` `run()`) to the WebContext
# it constructs; `memory-pressure-settings` is a construct-only property so it
# cannot be set from application code. The fork is one commit on top of the
# upstream `wry-v0.53.5` tag (only `src/webkitgtk/web_context.rs` changes; see
# https://github.com/Stalagmight/wry/blob/v0.53.5-stalagmight1/MODIFICATIONS.md).
# Pinned by rev for a reproducible build; the `v0.53.5-stalagmight1` tag points at
# the same commit. With the env vars unset it behaves exactly like upstream 0.53.5.
[patch.crates-io]
wry = { git = "https://github.com/Stalagmight/wry", rev = "ddb89c5e1a8e3a98ddb263d4eae7c4e9af800303" }

[profile.dev]
# Backtraces still show file:line; skipping full debug info halves the link step.
debug = "line-tables-only"

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[profile.profiling]
inherits = "release"
strip = false
debug = 1

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Pedantic noise - suppressed (too many false positives or impractical to fix)
doc_markdown = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
field_reassign_with_default = "allow"
match_same_arms = "allow"
items_after_statements = "allow"
too_many_arguments = "allow"
many_single_char_names = "allow"
type_complexity = "allow"
unused_self = "allow"
struct_excessive_bools = "allow"
large_enum_variant = "allow"
module_name_repetitions = "allow"
implicit_hasher = "allow"
trivially_copy_pass_by_ref = "allow"

# Panic safety - AI loves .unwrap()
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# Cast safety - suppressed (too many false positives across geometry/image code)
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"

# Prevent AI from silencing lints instead of fixing them
allow_attributes = "deny"

# No debug artifacts or stubs
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# Force proper logging
print_stdout = "deny"
print_stderr = "deny"

# Visibility hygiene - AI over-uses pub
wildcard_imports = "deny"

# String nonsense AI generates
inefficient_to_string = "deny"

# Clone-spam - AI appeases the borrow checker with .clone()
cloned_instead_of_copied = "warn"
redundant_clone = "warn"
implicit_clone = "warn"

# Async footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
large_futures = "warn"

# General AI sloppiness
explicit_into_iter_loop = "deny"
semicolon_if_nothing_returned = "deny"

# ── Extended AI-slop guardrails (2026-06). Rationale + the lints we considered
#    and deliberately DEFERRED (indexing_slicing, get_unwrap, map_err_ignore, …)
#    are recorded in docs/linting.md so they aren't naively re-litigated. ──
# Panic safety, cont.: a Result-returning fn that unwraps internally instead of `?`.
unwrap_in_result = "deny"
# Clone-spam, cont.: force explicit Rc::clone(&x) over x.clone(); no Rc clones in vec![x; n].
clone_on_ref_ptr = "deny"
rc_clone_in_vec_init = "deny"
# String nonsense, cont.: String.to_string() is a pointless re-alloc.
string_to_string = "deny"
# Misc AI footguns: redundant type annotations, mem::forget leaks, lossy float literals.
redundant_type_annotations = "deny"
mem_forget = "deny"
lossy_float_literal = "deny"
# API hygiene: don't request &mut you never use.
needless_pass_by_ref_mut = "deny"
# Dependency hygiene: no `version = "*"` deps.
wildcard_dependencies = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
missing_debug_implementations = "allow"
unused_qualifications = "deny"
unreachable_pub = "deny"

# The root package opts into the workspace lint tables above; every future
# member does the same, so the anti-slop policy applies workspace-wide.
[lints]
workspace = true

[dev-dependencies]
# `test-support` compiles the member's test-only helpers (formerly plain
# `#[cfg(test)]` in the unsplit crate) for this crate's own test builds;
# dev-dependencies don't affect production builds, so `cargo build` is unchanged.
stalagmight-core = { path = "crates/core", features = ["test-support"] }
stalagmight-models = { path = "crates/models", features = ["test-support"] }
stalagmight-parsers = { path = "crates/parsers", features = ["test-support"] }
stalagmight-persistence = { path = "crates/persistence", features = ["test-support"] }
stalagmight-speleodb = { path = "crates/speleodb", features = ["test-support"] }
tempfile = { workspace = true }
# The config round-trip assertions in tests/integration_tests.rs parse the
# saved file themselves; the config I/O itself lives in stalagmight-core now.
toml = { workspace = true }
tauri = { version = "2", features = ["test"] }
libc = "0.2"
